<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports — StockSense IMS</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div id="toast-container"></div>
<script src="/static/js/app.js"></script>
<script src="/static/js/layout.js"></script>

<script>
let monthlyChart;

(async () => {
  await checkAuth();
  const today = new Date().toISOString().split('T')[0];
  const thisMonth = today.slice(0, 7);

  renderLayout('/reports', '📈 Reports', `
    <!-- Tab Nav -->
    <div style="display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;">
      <button class="btn btn-primary" id="tab-daily" onclick="showTab('daily')">📅 Daily Report</button>
      <button class="btn btn-secondary" id="tab-monthly" onclick="showTab('monthly')">📆 Monthly Report</button>
      <button class="btn btn-secondary" id="tab-products" onclick="showTab('products')">📦 Product Report</button>
    </div>

    <!-- Daily -->
    <div id="section-daily">
      <div class="card" style="margin-bottom:20px;">
        <div class="card-header">
          📅 Daily Sales Report
          <div style="display:flex;gap:10px;align-items:center;">
            <input type="date" class="form-control" id="daily-date" value="${today}" style="width:auto;padding:7px 12px;">
            <button class="btn btn-secondary btn-sm" onclick="loadDaily()">🔍 Load</button>
            <a href="/api/reports/export?type=sales" class="btn btn-success btn-sm" target="_blank">⬇️ Export CSV</a>
          </div>
        </div>
        <div class="card-body">
          <div id="daily-summary" style="font-size:15px;margin-bottom:16px;"></div>
          <div class="table-wrapper">
            <table>
              <thead><tr><th>#</th><th>Product</th><th>Category</th><th>Qty</th><th>Unit Price</th><th>Total</th><th>Time</th></tr></thead>
              <tbody id="daily-body">
                <tr><td colspan="7" style="text-align:center;padding:30px;color:var(--text-muted);">Select a date and click Load</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- Monthly -->
    <div id="section-monthly" style="display:none;">
      <div class="card" style="margin-bottom:20px;">
        <div class="card-header">
          📆 Monthly Report
          <div style="display:flex;gap:10px;align-items:center;">
            <input type="month" class="form-control" id="monthly-month" value="${thisMonth}" style="width:auto;padding:7px 12px;">
            <button class="btn btn-secondary btn-sm" onclick="loadMonthly()">🔍 Load</button>
          </div>
        </div>
        <div class="card-body">
          <div id="monthly-total" style="margin-bottom:16px;"></div>
          <canvas id="monthly-chart" height="200" style="margin-bottom:20px;"></canvas>
          <div class="table-wrapper">
            <table>
              <thead><tr><th>Date</th><th>Transactions</th><th>Revenue</th></tr></thead>
              <tbody id="monthly-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- Products -->
    <div id="section-products" style="display:none;">
      <div class="card">
        <div class="card-header">
          📦 Product Sales Report
          <a href="/api/reports/export?type=products" class="btn btn-success btn-sm" target="_blank">⬇️ Export CSV</a>
        </div>
        <div class="table-wrapper">
          <table>
            <thead><tr><th>#</th><th>Product</th><th>Category</th><th>Price</th><th>Current Stock</th><th>Units Sold</th><th>Revenue</th></tr></thead>
            <tbody id="product-report-body">
              <tr><td colspan="7" style="text-align:center;padding:40px;"><div class="spinner" style="margin:auto;"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  `);

  loadDaily();
  loadProductReport();
})();

function showTab(tab) {
  ['daily','monthly','products'].forEach(t => {
    document.getElementById(`section-${t}`).style.display = t === tab ? 'block' : 'none';
    document.getElementById(`tab-${t}`).className = t === tab ? 'btn btn-primary' : 'btn btn-secondary';
  });
}

async function loadDaily() {
  const date = document.getElementById('daily-date').value;
  const r = await apiFetch(`/reports/daily?date=${date}`);
  if (!r || !r.ok) return;
  const d = r.data;
  document.getElementById('daily-summary').innerHTML = `
    <span style="margin-right:20px;">📊 <strong>${d.sales.length}</strong> transactions</span>
    <span style="color:var(--success);font-weight:700;font-size:18px;">Total: ${formatCurrency(d.total)}</span>`;
  const body = document.getElementById('daily-body');
  if (!d.sales.length) {
    body.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--text-muted);">No sales on ${date}</td></tr>`;
    return;
  }
  body.innerHTML = d.sales.map(s => `
    <tr>
      <td>#${s.id}</td><td>${s.name}</td><td>${s.category||'—'}</td>
      <td>${s.quantity_sold}</td><td>${formatCurrency(s.unit_price)}</td>
      <td><strong style="color:var(--success);">${formatCurrency(s.total_price)}</strong></td>
      <td style="font-size:12px;color:var(--text-muted);">${formatDateTime(s.sale_date)}</td>
    </tr>`).join('');
}

async function loadMonthly() {
  const month = document.getElementById('monthly-month').value;
  const r = await apiFetch(`/reports/monthly?month=${month}`);
  if (!r || !r.ok) return;
  const d = r.data;
  document.getElementById('monthly-total').innerHTML = `
    <span style="font-size:20px;font-weight:700;color:var(--success);">Monthly Revenue: ${formatCurrency(d.grand_total)}</span>`;

  if (monthlyChart) monthlyChart.destroy();
  monthlyChart = new Chart(document.getElementById('monthly-chart'), {
    type: 'line',
    data: {
      labels: d.data.map(x => x.date),
      datasets: [{
        label: 'Revenue',
        data: d.data.map(x => x.total),
        borderColor: '#e94560',
        backgroundColor: 'rgba(233,69,96,0.1)',
        fill: true, tension: 0.4, pointBackgroundColor: '#e94560',
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#8892b0' } },
        y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#8892b0', callback: v => '₹'+v.toLocaleString() } }
      }
    }
  });

  const body = document.getElementById('monthly-body');
  body.innerHTML = d.data.map(row => `
    <tr>
      <td>${row.date}</td>
      <td><span class="badge badge-info">${row.count}</span></td>
      <td><strong style="color:var(--success);">${formatCurrency(row.total)}</strong></td>
    </tr>`).join('');
}

async function loadProductReport() {
  const r = await apiFetch('/reports/products');
  if (!r || !r.ok) return;
  const body = document.getElementById('product-report-body');
  if (!r.data.length) {
    body.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--text-muted);">No products found</td></tr>`;
    return;
  }
  body.innerHTML = r.data.map((p, i) => `
    <tr>
      <td><span class="badge badge-muted">${i+1}</span></td>
      <td><strong>${p.name}</strong></td>
      <td><span class="badge badge-info">${p.category||'—'}</span></td>
      <td>${formatCurrency(p.price)}</td>
      <td>${stockBadge(p.quantity, 10)}</td>
      <td><span class="badge badge-muted">${p.total_sold}</span></td>
      <td><strong style="color:var(--success);">${formatCurrency(p.revenue)}</strong></td>
    </tr>`).join('');
}
</script>
</body>
</html>
